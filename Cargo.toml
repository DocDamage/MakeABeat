[package]
name = "lost-samples-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
hound = "3.5.1"
rfd = "0.15.4"
ring = "0.17.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
url = "2"

[target.'cfg(not(windows))'.dependencies]
midir = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
midir = { version = "0.11", features = ["winrt"] }
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }
windows-core = "0.62.2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_WindowsProgramming"] }

[profile.release]
lto = "thin"
